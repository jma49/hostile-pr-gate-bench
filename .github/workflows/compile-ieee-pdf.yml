name: Compile IEEEtran PDF Artifact

on:
  push:
    paths:
      - "paper/**"
      - "literature/refs.bib"
      - ".github/workflows/compile-ieee-pdf.yml"
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile IEEEtran LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload compiled IEEEtran PDF
        uses: actions/upload-artifact@v4
        with:
          name: hostile-pr-gate-ieeetran-pdf
          path: paper/main.pdf
